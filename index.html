<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator jQuery</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <div class="identity">
            <p>Nama: <span>Elisabeth Sri Rezeki Malau</span></p>
            <p>NIM: <span>255150701111018</span></p>
        </div>

        <h1>KALKULATOR</h1>

        <section class="calculator" aria-label="Kalkulator">
            <div id="display" class="display" aria-live="polite">0</div>

            <div class="keypad">
                <button class="number" data-number="7">7</button>
                <button class="number" data-number="8">8</button>
                <button class="number" data-number="9">9</button>
                <button class="operator" data-operator="+">+</button>

                <button class="number" data-number="4">4</button>
                <button class="number" data-number="5">5</button>
                <button class="number" data-number="6">6</button>
                <button class="operator" data-operator="-">-</button>

                <button class="number" data-number="1">1</button>
                <button class="number" data-number="2">2</button>
                <button class="number" data-number="3">3</button>
                <button class="operator" data-operator="*">*</button>

                <button class="number" data-number="0">0</button>
                <button class="number" data-number=".">.</button>
                <button id="clear" class="clear">C</button>
                <button class="operator" data-operator="/">/</button>

                <button id="equals" class="equals">=</button>
            </div>
        </section>
    </main>
</body>
</html>
